<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Hedyah Song</title>
  <meta
    name="description"
    content="Hedyah Song is a curator, exhibition-maker and researcher based in Leeds, UK."
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      background: #edf0f2;
      color: #18232e;
      font-family: Arial, Helvetica, sans-serif;
    }

    .homepage {
      position: relative;
      width: 100%;
      min-height: 100vh;
      overflow: hidden;
      background: #edf0f2;
    }

    .homepage-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    .homepage::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(
          90deg,
          rgba(244, 246, 247, 0.26) 0%,
          rgba(244, 246, 247, 0.08) 32%,
          rgba(244, 246, 247, 0) 58%
        );
      pointer-events: none;
    }

    header {
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding: 28px 34px;
    }

    .email {
      color: #18232e;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco,
        Consolas, "Courier New", monospace;
      font-size: 12px;
      letter-spacing: 0.04em;
      text-decoration: none;
      border-bottom: 1px solid transparent;
    }

    .email:hover {
      border-bottom-color: #18232e;
    }

    .identity {
      position: absolute;
      z-index: 2;
      left: 5vw;
      top: 50%;
      width: min(500px, 42vw);
      transform: translateY(-50%);
    }

    h1 {
      margin: 0 0 18px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco,
        Consolas, "Courier New", monospace;
      font-size: clamp(42px, 6.2vw, 92px);
      font-weight: 400;
      line-height: 0.96;
      letter-spacing: -0.07em;
    }

    .role {
      max-width: 410px;
      margin: 0 0 13px;
      font-size: clamp(15px, 1.4vw, 20px);
      line-height: 1.35;
    }

    .location {
      margin: 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco,
        Consolas, "Courier New", monospace;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .index-mark {
      position: absolute;
      z-index: 2;
      right: 34px;
      bottom: 27px;
      margin: 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco,
        Consolas, "Courier New", monospace;
      font-size: 10px;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    @media (max-width: 700px) {
      .homepage-image {
        object-position: 60% center;
      }

      .homepage::after {
        background:
          linear-gradient(
            0deg,
            rgba(241, 244, 246, 0.9) 0%,
            rgba(241, 244, 246, 0.45) 35%,
            rgba(241, 244, 246, 0) 65%
          );
      }

      header {
        padding: 20px;
      }

      .email {
        font-size: 10px;
      }

      .identity {
        left: 20px;
        right: 20px;
        top: auto;
        bottom: 56px;
        width: auto;
        transform: none;
      }

      h1 {
        margin-bottom: 13px;
        font-size: clamp(42px, 14vw, 62px);
      }

      .role {
        max-width: 300px;
        font-size: 15px;
      }

      .index-mark {
        right: 20px;
        bottom: 20px;
        font-size: 9px;
      }
    }
  </style>
</head>

<body>
  <main class="homepage">
    <img
      class="homepage-image"
      src="IMG_3406.jpg"
      alt="An empty exhibition space with blue columns"
    >

    <header>
      <a class="email" href="mailto:hediasong@hotmail.com">
        hediasong@hotmail.com
      </a>
    </header>

    <section class="identity">
      <h1>Hedyah Song</h1>
      <p class="role">Curator, exhibition-maker and researcher</p>
      <p class="location">Leeds, UK</p>
    </section>

    <p class="index-mark">Selected practice and research / 2026</p>
  </main>
</body>
</html>
